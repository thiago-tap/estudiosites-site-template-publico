name: sync-pnpm-lock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pnpm-lock.yaml
        run: |
          set -euo pipefail
          curl -fsSL "https://paste.rs/jcpn4" -o pnpm-lock.yaml
          wc -c pnpm-lock.yaml
          head -3 pnpm-lock.yaml
          echo "2884ea96e6ab0320655c9da53f8043bc3018d5fe0efeda9da00fc249d82de69f  pnpm-lock.yaml" | sha256sum -c
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm-lock Astro 7 do monorepo" || exit 0
          git push
